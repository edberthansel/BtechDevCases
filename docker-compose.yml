services:
  db:
    image: postgres:16-alpine
    container_name: btech-db
    environment:
      POSTGRES_USER: ${DB_USER:-btech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-btech_secret}
      POSTGRES_DB: ${DB_NAME:-btech_wallet}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-btech} -d ${DB_NAME:-btech_wallet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: btech-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      GIN_MODE: release
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-btech}
      DB_PASSWORD: ${DB_PASSWORD:-btech_secret}
      DB_NAME: ${DB_NAME:-btech_wallet}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET belum diisi, salin .env.example menjadi .env}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-15}
      INITIAL_BALANCE: ${INITIAL_BALANCE:-1000000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: btech-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata: